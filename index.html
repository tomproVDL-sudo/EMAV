<meta name="theme-color" content="#f1f3f5">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* EMAV : même charte que l'outil CO2 (en-tête, étapes numérotées, cartes), accent bleu ; utilisable sur téléphone et sur ordinateur. */
:root{--bg:#f1f3f5;--surface:#ffffff;--ink:#17222b;--muted:#566876;--line:#d5dce2;--accent:#16486e;--accent2:#1f5f8f;--accent-ink:#ffffff;--accent-soft:#e1ebf4;--bad:#b0322a;--good:#2f7d4f;--warn:#a8650c;--desk:#dfe4e8;
  --sans:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1418;--surface:#172027;--ink:#e3eaef;--muted:#93a4b1;--line:#2a3742;--accent:#6aa7d8;--accent2:#7fb6e3;--accent-ink:#08151f;--accent-soft:#1b3142;--desk:#0a0f12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1418;--surface:#172027;--ink:#e3eaef;--muted:#93a4b1;--line:#2a3742;--accent:#6aa7d8;--accent2:#7fb6e3;--accent-ink:#08151f;--accent-soft:#1b3142;--desk:#0a0f12;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-left)) 120px}
h1,h2,h3{font-weight:650;line-height:1.2;margin:0}
.apptop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.apptop h1{font-size:21px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.apptop h1 .brand{color:var(--accent)}
.apptop .appico{width:30px;height:30px;border-radius:7px;flex:none}
.apptop .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{display:flex;gap:2px;margin:0 -16px 16px;padding:0 16px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps button{all:unset;cursor:pointer;padding:10px 10px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;gap:7px;align-items:center;white-space:nowrap;flex:none}
.steps button .n{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:50%;width:22px;height:22px;display:grid;place-items:center}
.steps button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.steps button[aria-selected="true"] .n{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.steps button.done .n{border-color:var(--accent2);color:var(--accent2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:12px;min-width:0}
.card h2{font-size:17px;margin:0 0 8px}
.card h3{font-size:12.5px;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.cols{display:grid;gap:0 12px}
@media (min-width:900px){.cols{grid-template-columns:1fr 1fr}.cols>.card.full{grid-column:1/-1}}
.hint{font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{width:100%;font-size:16px;min-height:50px}
.btn.sm{min-height:36px;padding:5px 11px;font-size:14px}
.btn.back{min-width:40px;font-size:18px}
.btn.del{color:var(--bad)}
.btn:disabled{opacity:.45}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600;margin:10px 0}
label.f small{font-weight:400;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:9px 11px;min-height:44px;width:100%}
textarea{min-height:80px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;min-height:38px;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.addv{display:flex;gap:6px;margin-top:8px}.addv input{min-height:38px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:6px;overflow:hidden;max-width:420px}
.seg button{border:0;background:var(--surface);min-height:44px;font-weight:600;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:15}
.barin{max-width:1120px;margin:0 auto;display:flex;gap:10px}.barin .btn{flex:1}
@media (min-width:900px){.barin .btn{flex:0 0 auto;min-width:200px}.barin{justify-content:flex-end}}
.stepper{display:grid;grid-template-columns:46px 1fr 46px;border:1px solid var(--line);border-radius:6px;overflow:hidden;width:190px}
.stepper button{border:0;background:var(--accent-soft);font-size:22px;font-weight:700;min-height:44px;cursor:pointer}
.stepper input{border:0;border-radius:0;text-align:center;font-weight:700;font-size:18px;min-height:44px}
.qrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.qrow .q{font-size:14px;font-weight:600}.qrow .q small{display:block;font-weight:400;color:var(--muted)}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.wopt{border:1.5px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 6px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;text-align:center;line-height:1.2;cursor:pointer;min-height:118px;color:var(--accent)}
.wopt span{color:var(--ink)}
.wopt svg{width:58px;height:66px}
.otype{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:10px 0;background:var(--bg)}
.otype .hd{display:flex;align-items:center;gap:10px;color:var(--accent)}.otype .hd b{color:var(--ink)}
.otype .hd svg{width:44px;height:50px;flex:none}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
.ph{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#dfe5e8}
.ph input{border:0;border-top:1px solid var(--line);border-radius:0;font-size:13px;min-height:38px;padding:6px 8px}
.ph .x{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 4px 8px;font-size:11px;color:var(--muted);gap:4px}
.ph .x span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph .x button{border:0;background:none;color:var(--bad);font-weight:600;padding:6px;cursor:pointer;flex:none}
.capchips{display:flex;flex-wrap:wrap;gap:4px;padding:0 6px 6px}
.capchips button{border:1px solid var(--line);background:var(--bg);border-radius:999px;font-size:11px;padding:3px 7px;cursor:pointer}
.photoadd{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;max-width:520px}
.list .it{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.list .it:first-child{border-top:0}
.list .it .t{font-weight:600}.list .it .s{font-size:13px;color:var(--muted)}
.badge{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.badge.done{background:#e1efe6;color:var(--good)}.badge.draft{background:#f8eedb;color:#8a5b0c}.badge.none{background:var(--bg);color:var(--muted)}
.planbox{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fbfcfc;touch-action:none}
.planbox svg{display:block;width:100%;height:auto}
.planctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.planctl button{width:40px;height:40px;border-radius:6px;border:1px solid var(--line);background:#fff;color:#17222b;font-size:20px;font-weight:700;cursor:pointer}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin:8px 0}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:14px;height:14px;border-radius:3px;display:inline-block}
.akpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.akpi{background:var(--bg);border-radius:6px;padding:10px}
.akpi b{display:block;font-size:22px}.akpi span{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#17222b;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;max-width:90vw;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.ovl{position:fixed;inset:0;background:var(--desk);z-index:40;overflow:auto}
.ovl .ovtop{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;padding:8px 16px}
.ovl .ovtop h1{font-size:17px;flex:1}
.ovl .ovtop{flex-wrap:wrap;row-gap:8px}.ovl .ovtop .seg{flex:1 1 230px;max-width:360px}.ovl .ovtop .seg button{min-height:38px;padding:0 10px;white-space:nowrap}
@media (max-width:640px){.ovl .ovtop{padding:8px 10px}.ovl .ovtop h1{flex:1 1 calc(100% - 56px);font-size:15px}.ovl .ovtop .seg{flex:1 1 100%;max-width:none}.ovl .ovtop #opdf,.ovl .ovtop #oprint{flex:1 1 40%;min-height:42px}}
.err{color:var(--bad);font-size:13px}
.req::after{content:" *";color:var(--bad)}
.modal{position:fixed;inset:0;background:rgba(10,20,28,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center;padding:12px}
.sheet{background:var(--surface);border-radius:12px;padding:18px;width:100%;max-width:460px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.sheet h2{font-size:18px;margin:0 0 6px}.sheet .opts{display:grid;gap:8px}.sheet .opts .btn{justify-content:flex-start;text-align:left;min-height:58px}
.sheet .ol{display:flex;gap:12px;align-items:center}.sheet .ol small{display:block;font-weight:400;font-size:12.5px;opacity:.85}
@media (min-width:700px){.modal{align-items:center}}
.regbox{background:var(--accent-soft);border-radius:6px;padding:10px 12px;font-size:13px;margin-bottom:10px}
@media (min-width:700px){.akpis{grid-template-columns:repeat(4,1fr)}}
@media print{body.ovlopen #app{display:none}.bar,.noprint,.ovtop{display:none!important}.ovl{position:static;background:#fff}body{background:#fff}}
.hfilt{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}.hfilt .chips{margin:0}.hfilt .chip small{opacity:.65;margin-left:3px}.hfilt select{width:auto;align-self:flex-start}
</style>

const DB={db:null,
  open(){return new Promise((res,rej)=>{let r;try{r=indexedDB.open('emav_terrain',1)}catch(e){rej(e);return}
    r.onupgradeneeded=()=>{const d=r.result;for(const s of['visits','rooms','photos'])if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})};
    r.onsuccess=()=>{DB.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  tx(s,m,fn){return new Promise((res,rej)=>{const t=DB.db.transaction(s,m),st=t.objectStore(s);const q=fn(st);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  get(s,k){return DB.tx(s,'readonly',st=>st.get(k))},put(s,o){return DB.tx(s,'readwrite',st=>st.put(o))},del(s,k){return DB.tx(s,'readwrite',st=>st.delete(k)).then(x=>{netDel(s,k);return x})},all(s){return DB.tx(s,'readonly',st=>st.getAll())}};

    if(docs.length){PLANS={index:(ix&&ix.exists&&ix.data&&ix.data.list)||docs.map(d=>({s:d.s,ecoles:d.ecoles||[],bats:(d.bats||[]).map(b=>({b:b.b,n:b.n})),n:d.r.length})),docs:{}};for(const d of docs)PLANS.docs[d.s]=d;for(const k in planCache)delete planCache[k];NET.plans=docs.length}}catch(e){}}
async function pool(items,n,fn){let i=0;await Promise.all(Array.from({length:Math.min(n,items.length)},async()=>{while(i<items.length){const x=items[i++];await fn(x)}}))}
async function netPushVisit(v){if(!NET.on||NET.ro)return;try{await netApi('PUT','emav_visites/'+v.id,v);NET.seen.add('v:'+v.id);netSeenSave()}catch(e){NET.err=e.message}}
async function netPushRoom(r){if(!NET.on||NET.ro)return;try{
    for(const p of r.photos||[]){if(p.ref||NET.seen.has('p:'+p.id))continue;const d=await DB.get('photos',p.id);if(!d||!d.blob)continue;
      const q=await fetch('api/emav-blob/'+p.id,{method:'PUT',body:d.blob});if(q.ok)NET.seen.add('p:'+p.id)}
    await netApi('PUT','emav_pieces/'+r.id,r);NET.seen.add('r:'+r.id);netSeenSave()}catch(e){NET.err=e.message}}
async function netDel(store,id){if(!NET.on||NET.ro||String(id).startsWith('__'))return;try{
  if(store==='visits'){await netApi('DELETE','emav_visites/'+id);NET.seen.delete('v:'+id)}else if(store==='rooms'){await netApi('DELETE','emav_pieces/'+id);NET.seen.delete('r:'+id)}

async function netSync(){if(!NET.on||NET.busy)return false;NET.busy=true;let changed=0;try{
    const[rv,rr]=await Promise.all([netApi('LIST','emav_visites'),netApi('LIST','emav_pieces')]);
    const RV=new Map(rv.docs.map(d=>[d.id,d.data])),RR=new Map(rr.docs.map(d=>[d.id,d.data]));
    const LV=new Map((await DB.all('visits')).map(v=>[v.id,v])),LR=new Map((await DB.all('rooms')).map(r=>[r.id,r]));
    /* reçu des autres postes : plus récent, ou nouveau */
    for(const[id,d]of RV){const l=LV.get(id);if(!l||(d.updated||0)>(l.updated||0)){await DB.put('visits',{...d,id});changed++}NET.seen.add('v:'+id)}
    for(const[id,d]of RR){const l=LR.get(id);if(!l||(d.updated||0)>(l.updated||0)){await DB.put('rooms',{...d,id});changed++}NET.seen.add('r:'+id)}
    /* supprimé sur un autre poste */
    for(const[id]of LV)if(!RV.has(id)&&NET.seen.has('v:'+id)){await DB.tx('visits','readwrite',s=>s.delete(id));NET.seen.delete('v:'+id);LV.delete(id);changed++}
    for(const[id,r]of LR)if(!RR.has(id)&&NET.seen.has('r:'+id)){await DB.tx('rooms','readwrite',s=>s.delete(id));for(const p of r.photos||[])await DB.tx('photos','readwrite',s=>s.delete(p.id));NET.seen.delete('r:'+id);LR.delete(id);changed++}
    /* envoyé : nouveau ou plus récent sur ce poste */
    const pv=[...LV.values()].filter(v=>!NET.seen.has('v:'+v.id)?!RV.has(v.id):(RV.has(v.id)&&(v.updated||0)>(RV.get(v.id).updated||0)));
    const pr=[...LR.values()].filter(r=>!NET.seen.has('r:'+r.id)?!RR.has(r.id):(RR.has(r.id)&&(r.updated||0)>(RR.get(r.id).updated||0)));
    if(!NET.ro){await pool(pv,6,netPushVisit);await pool(pr,6,netPushRoom)}NET.nv=RV.size;NET.nr=RR.size;NET.pend=NET.ro?0:pv.length+pr.length;
    NET.last=Date.now();NET.err='';netSeenSave()}
  catch(e){NET.err=e.message}finally{NET.busy=false}
  if(changed){await loadAll();if(!/^#\/r\//.test(location.hash))route()}return changed>0}

let PLANS={index:[],docs:{}},BDD=[];
try{const pk=JSON.parse($('#plansdata').textContent);PLANS.index=pk.index||[];for(const d of pk.docs||[])PLANS.docs[d.s]=d}catch(e){}
try{BDD=(JSON.parse($('#bdddata').textContent).rows)||[]}catch(e){}
const decRings=p=>String(p||'').split(';').filter(Boolean).map(r=>r.split(',').map(xy=>{const k=xy.indexOf(' ');return[+xy.slice(0,k)/10,+xy.slice(k+1)/10]}));
const planCache={};
function getPlan(sc){if(!sc)return null;if(planCache[sc])return planCache[sc];const d=PLANS.docs[sc];if(!d)return null;
  const p={s:sc,ecoles:d.ecoles||[],rooms:(d.r||[]).map((x,i)=>({...x,i,rings:decRings(x.p)})),bats:(d.bats||[]).map(b=>({...b,rings:decRings(b.p)}))};planCache[sc]=p;return p}
function bddByS(sc){return BDD.filter(r=>(r.s||[]).includes(sc))}
function etabCandidates(){
  const out=[],seen=new Set();
  for(const r of BDD){const k=plain(r.n);if(seen.has(k))continue;seen.add(k);out.push({n:r.n,t:r.t,a:[r.a,r.v].filter(Boolean).join(', '),q:r.q,s:(r.s||[]).filter(s=>PLANS.docs[s]).concat((r.s||[]).filter(s=>!PLANS.docs[s]))})}
  for(const d of PLANS.index)for(const n of(d.ecoles||[]).concat((d.bats||[]).map(b=>b.n))){const k=plain(n);if(!n||seen.has(k))continue;seen.add(k);const b=bddByS(d.s)[0];
    out.push({n,t:b?b.t:'',a:b?[b.a,b.v].filter(Boolean).join(', '):'',q:b?b.q:'',s:[d.s]})}
  return out.sort((a,b)=>a.n.localeCompare(b.n,'fr'));
}
function guessEtabType(c){const t=plain((c.t||'')+' '+c.n);if(/creche|halte|multi|accueil|petite enfance/.test(t))return'CRECHE';if(/restaurant/.test(t))return'RESTAURANT SCOLAIRE';if(/mairie/.test(t))return'MAIRIE';if(/conservatoire/.test(t))return'CONSERVATOIRE';if(/ecole|maternelle|elementaire|primaire|groupe scolaire/.test(t))return'ECOLE';return''}
function guessSalleType(s){const t=plain(s);for(const[k,re]of[['Dortoir',/dortoir|repos|sieste/],['Arts plastiques',/plastique/],['Salle informatique',/informatique|\binfo\b/],['Réfectoire',/refectoire|restaurant|cantine/],['Salle de motricité',/motricite/],['Classe',/classe/],['BCD',/bcd|biblio/],['Salle de vie',/vie/],['Salle d\'activités',/activit/],['Salle de jeux',/jeux/],['Salle Polyvalente',/polyvalent/],['Salle de sport',/sport|gym/],['Bureau',/bureau/],['Salle de musique',/musique/]])if(re.test(t))return k;return''}

/* ================= calculs par pièce ================= */
function totOuv(r){return(r.ouv||[]).reduce((a,o)=>a+num(o.n),0)}
function roomCalc(r){
  const T=r.nat==='Oui'?totOuv(r):0,f=Math.min(num(r.fonct),T),a=Math.min(num(r.access),T),m=Math.min(num(r.manoeuv),T);
  const E=r.entree||{},S=r.sortie||{},En=E.has==='Oui'?num(E.n):0,Sn=S.has==='Oui'?num(S.n):0;
  const Eok=E.has==='Oui'?Math.max(0,Math.min(num(E.ok),En)-num(E.enc)):0,Sok=S.has==='Oui'?Math.max(0,Math.min(num(S.ok),Sn)-num(S.enc)):0;
  const B=En+Sn,Bok=Eok+Sok,good=Math.min(f,a,m);let G=0,Gok=0,Genc=0,Gcas=0,Gobt=0;
  if(r.nat==='Oui')for(const o of r.ouv||[])if(o.grille==='Oui'){const n=num(o.gn);G+=n;Genc+=num(o.genc);Gcas+=num(o.gcas);Gobt+=num(o.gobt);Gok+=Math.max(0,n-num(o.genc)-num(o.gcas)-num(o.gobt))}
  const grilles=G;
  const rOuv=T?good/T:null,rB=B?Bok/B:null;
  let cls;
  if(!T&&!B)cls=r.meca==='Oui'&&r.mecaEtat==='Fonctionne'?'mid':'bad';
  else if((T===0||rOuv===1)&&(B===0||rB===1)&&(G===0||Gok===G)&&(f>0||Bok>0))cls='good';
  else if((f===0&&Bok===0)||((rOuv==null||rOuv<0.5)&&(rB==null||rB<0.5)))cls='bad';
  else cls='mid';
  return{T,f,a,m,good,En,Sn,Eok,Sok,B,Bok,rOuv,rB,cls,grilles,G,Gok,Genc,Gcas,Gobt,constats:(r.constats||[]).length};
}
const CLS={good:{lab:'Moyens d\'aération satisfaisants',col:'var(--c-good)',hex:'#2f6fb3'},mid:{lab:'À améliorer',col:'var(--c-mid)',hex:'#8f83d9'},bad:{lab:'Insuffisants',col:'var(--c-bad)',hex:'#5b2a86'}};
function ratioHex(x){return x==null?'#e3e8eb':x>=1?'#2f6fb3':x>=0.75?'#6f8fd0':x>=0.5?'#8f83d9':'#5b2a86'}
function roomProblems(r){const c=roomCalc(r),p=[];
  if(!r.salle)p.push('nom de la salle');if(!r.typeSalle)p.push('type de salle');if(!r.nat)p.push('aération naturelle (oui / non)');if(r.nat==='Oui'&&!c.T)p.push('types d\'ouvrant');
  if(!r.meca)p.push('aération mécanique (oui / non)');if(!(r.photos||[]).some(x=>x.cat==='ens'))p.push('photo de l\'ensemble de la pièce');
  if(r.nat==='Oui'&&c.T&&!(r.photos||[]).some(x=>x.cat==='ouv'))p.push('photo des ouvrants');
  if(r.prev){const se=r.prev.seen||{};if(r.nat==='Oui'&&c.T&&!se[1])p.push('état des ouvrants à vérifier (prérempli)');if(r.meca==='Oui'&&!se[2])p.push('état de la ventilation à vérifier (prérempli)');if(((r.entree||{}).has==='Oui'||(r.sortie||{}).has==='Oui')&&!se[3])p.push('état des bouches à vérifier (prérempli)')}
  return p}

function route(){
  const h=location.hash.replace(/^#\/?/,'').split('/');closeOvl();
  if(NET.ro&&h[0]==='new'){location.hash='#/';return}
  if(NET.ro&&h[0]==='r'){const r=MEM.rooms.find(x=>x.id===h[1]),v=r&&MEM.visits.find(x=>x.id===r.visitId);if(v){ST.view='visit';ST.visitId=v.id;ST.tab='pieces';renderVisit();showReport('room',v,r);return}}
  if(h[0]==='v'&&MEM.visits.find(v=>v.id===h[1])){ST.view='visit';ST.visitId=h[1];ST.tab=h[2]||ST.tab||'plan';renderVisit()}
  else if(h[0]==='r'&&MEM.rooms.find(r=>r.id===h[1])){ST.view='room';ST.roomId=h[1];ST.step=Math.max(0,Math.min(STEPS.length-1,+h[2]||0));renderRoom()}

  else if(h[0]==='set'){renderSettings()}

}
function ficheLinkFind(){const q=new URLSearchParams(location.hash.split('?')[1]||''),k=q.get('k')||'etab',e=plain(q.get('e')||'').trim(),d=(q.get('d')||'').slice(0,10),a=String(q.get('a')||'').toUpperCase(),s=plain(q.get('s')||'').replace(/[^a-z0-9]/g,'');

  if(!v){const L=MEM.visits.filter(x=>plain(x.etab||'').trim()===e||(a&&roomsOf(x.id).some(r=>String(r.astech||'').toUpperCase()===a)));v=L.find(x=>String(x.date||'').slice(0,10)===d)||L.sort((x,y)=>String(y.date).localeCompare(String(x.date)))[0]}
  if(!v)return{k};const rs=roomsOf(v.id);let r=rs.find(x=>x.id===q.get('r'))||(a&&rs.find(x=>String(x.astech||'').toUpperCase()===a))||(s&&rs.find(x=>plain(x.salle||'').replace(/[^a-z0-9]/g,'')===s));return{k,v,r}}

/* ================= accueil ================= */
/* état d'une visite pour le filtre de l'accueil */
const VST={nouv:{l:'Nouvelle',b:'none'},cours:{l:'En cours',b:'draft'},fin:{l:'Terminée',b:'draft'},exp:{l:'Exportée / envoyée',b:'done'},hist:{l:'Historique',b:'done'}};
function visitState(v){if(v.ref)return'hist';if(v.exported)return'exp';if(v.src==='forms')return'hist';const rs=roomsOf(v.id);if(!rs.length)return'nouv';return rs.every(r=>r.status==='done')?'fin':'cours'}
function visitFilters(vs){const cnt={};for(const v of vs){const s=visitState(v);cnt[s]=(cnt[s]||0)+1}const yrs=[...new Set(vs.map(v=>String(v.date||'').slice(0,4)).filter(Boolean))].sort().reverse();const F=LS.get('emav_hf',{st:'',yr:''});
  return`<div class="hfilt"><input type="search" id="hq" placeholder="Rechercher un établissement, une date…"><div class="chips" id="hst">${[['','Toutes',vs.length]].concat(Object.keys(VST).map(k=>[k,VST[k].l,cnt[k]||0])).map(([k,l,n])=>`<button type="button" class="chip" data-st="${k}" aria-pressed="${F.st===k}">${l} <small>${n}</small></button>`).join('')}</div>
    ${yrs.length>1?`<select id="hyr" style="width:auto"><option value="">Toutes les années</option>${yrs.map(y=>`<option ${F.yr===y?'selected':''}>${y}</option>`).join('')}</select>`:''}</div>`}
function applyVisitFilter(){const q=plain(($('#hq')||{}).value||''),F=LS.get('emav_hf',{st:'',yr:''});let n=0,t=0;
  document.querySelectorAll('#hlist .it').forEach(it=>{t++;const ok=(!q||plain(it.textContent).includes(q))&&(!F.st||it.dataset.st===F.st)&&(!F.yr||it.dataset.yr===F.yr);it.hidden=!ok;if(ok)n++});
  const c=$('#hcount');if(c)c.textContent=n<t?`${n} visite${n>1?'s':''} affichée${n>1?'s':''} sur ${t}.`:''}
async function renderHome(){
  const vs=MEM.visits.slice().sort((a,b)=>(b.updated||0)-(a.updated||0));
  let est='';try{if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();est=`Espace utilisé sur ce téléphone : ${(e.usage/1048576).toFixed(0)} Mo.`}}catch(e){}
  shell('EMAV terrain','Évaluation des moyens d\'aération et de ventilation','',

/* ================= fichier du téléphone (donnees_emav.json) =================
   Créé sur l'ordinateur (accueil > « Préparer un téléphone ») : établissements et plans à jour (base partagée) et visites antérieures,
   sans photos. Importé en une fois sur le téléphone : la nouvelle visite y est préremplie et comparée comme sur l'ordinateur.
   Données internes : à transmettre par la messagerie de la Ville ou par câble, jamais en ligne. */
async function importDonnees(pk){if(!pk||!Array.isArray(pk.docs))throw new Error('format inattendu (fichier donnees_emav.json attendu)');
  PLANS={index:pk.index||[],docs:{}};for(const d of pk.docs)PLANS.docs[d.s]=d;if(Array.isArray(pk.bdd)&&pk.bdd.length)BDD=pk.bdd;for(const k in planCache)delete planCache[k];
  try{await DB.put('photos',{id:'__plans__',json:{index:pk.index||[],docs:pk.docs,bdd:pk.bdd||[],at:pk.at||0}})}catch(_){}
  let nv=0,nr=0;if(Array.isArray(pk.visites)&&Array.isArray(pk.pieces)){const LV=new Map(MEM.visits.map(v=>[v.id,v])),LR=new Map(MEM.rooms.map(r=>[r.id,r]));
    for(const v of pk.visites){const l=LV.get(v.id);if(l&&!l.ref&&(l.updated||0)>=(v.updated||0))continue;if(l&&(l.updated||0)>(v.updated||0))continue;await DB.put('visits',{...v,ref:1});nv++}
    for(const r of pk.pieces){const l=LR.get(r.id);if(l&&(l.updated||0)>=(r.updated||0))continue;await DB.put('rooms',r);nr++}
    await loadAll()}
  toast(`${pk.docs.length} plans, ${(pk.bdd||BDD).length} établissements${Array.isArray(pk.visites)?`, ${pk.visites.length} visites antérieures (${pk.pieces.length} pièces${nv||nr?'':', déjà à jour'})`:''} chargés.`,5000)}
async function phoneFile(all,st){st('Préparation…');if(NET.on){await netRef();await netSync()}
  const byE=new Map();for(const v of MEM.visits){if(!roomsOf(v.id).length||v.ref&&!NET.on&&false)continue;const k=(v.sc||'')+'|'+plain(v.etab||'').trim();(byE.get(k)||byE.set(k,[]).get(k)).push(v)}
  const V=[];for(const L of byE.values()){L.sort((a,b)=>String(b.date).localeCompare(String(a.date)));V.push(...(all?L:L.slice(0,1)))}
  const ids=new Set(V.map(v=>v.id)),P=MEM.rooms.filter(r=>ids.has(r.visitId)).map(r=>({...r,photos:[]}));
  const pk={format:'emav-donnees',version:2,app:EMAV_VERSION,at:Date.now(),poste:NET.dir?'base partagée':'',index:PLANS.index,docs:Object.values(PLANS.docs),bdd:BDD,visites:V.map(v=>({...v,ref:undefined})),pieces:P};
  const blob=new Blob([JSON.stringify(pk)],{type:'application/json'}),fn=`donnees_emav_${todayIso()}.json`;
  if(await saveBlob(blob,fn,st))st(`<b>${fn}</b> créé (${mo(blob)}) : ${pk.docs.length} plans, ${BDD.length} établissements, ${V.length} visite${V.length>1?'s':''} (${P.length} pièces, sans photos). À envoyer sur le téléphone par la messagerie de la Ville ou par câble, puis dans EMAV du téléphone : « Importer donnees_emav.json ». Ne jamais le publier en ligne.`)}

function planBox(rooms){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const r of rooms)for(const g of r.rings)for(const[x,y]of g){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}return{x0,y0,x1,y1}}

function planSVG(P,lv,rooms,W,H,view,mode,interactive){

  for(const b of P.bats)s+=`<path d="${ringPath(b.rings,tx)}" fill="none" stroke="#dde3e6"/>`;

  for(const pr1 of pr){const r=byRi.get(pr1.i),c=centroid(pr1),wpx=c.w/v.k,[px,py]=tx(c.x,c.y).split(' ').map(Number);
    if(px<-40||px>W+40||py<-40||py>H+40)continue;

    const k=roomCalc(r),items=[];
    if(mode!=='bou'&&k.T)items.push(['win',`${k.good}/${k.T}`]);if(mode!=='ouv'&&k.B)items.push(['vent',`${k.Bok}/${k.B}`]);if(k.G&&mode!=='bou')items.push(['grille',`${k.Gok}/${k.G}`]);if(k.constats)items.push(['warn','']);
    const big=wpx>=95,sc=wpx<55?0.8:1;

    s+=`<g pointer-events="none">`;
    items.forEach((it,i)=>{s+=`<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${sc})">${ICO[it[0]]()}${it[1]&&big?`<text x="21" y="13.5" font-size="11.5" font-weight="700" fill="#17242b" stroke="#fff" stroke-width="3" paint-order="stroke">${it[1]}</text>`:''}</g>`;x+=widths[i]+3});
    if(wpx>=70&&nm)s+=`<text x="${px}" y="${(y+30*sc).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff" stroke="#17242b" stroke-width="2.6" paint-order="stroke">${esc(nm.length>18?nm.slice(0,17)+'…':nm)}</text>`;
    s+=`</g>`}
  s+=`<g transform="translate(10 ${H-10})"><line x1="0" x2="${(10/v.k).toFixed(1)}" y1="0" y2="0" stroke="#33413f" stroke-width="2"/><text x="0" y="-4" font-size="10" fill="#33413f">10 m</text></g>`;
  return s+'</svg>';

function drawVisitPlan(){const v=curVisit(),P=getPlan(v.sc),host=$('#plansvg');if(!host)return;const W=Math.max(320,Math.round(host.clientWidth||600)),H=Math.round(Math.min(W*0.95,Math.max(420,window.innerHeight-260)));

  const prev=$('#prev'),next=$('#next'),fin=$('#finish');

function setNum(r,name,val,redraw){let v=Math.max(0,Math.round(num(val)));const st=$(`[data-step="${name}"]`),mx=st&&st.dataset.max!=null?+st.dataset.max:null;if(mx!=null)v=Math.min(v,mx);
  setPath(r,name,v);const m=name.match(/^(fonct|access|manoeuv)$/);if(m){r.touched=r.touched||{};r.touched[name]=true}
  const m2=name.match(/^(entree|sortie)\.ok$/);if(m2){r[m2[1]].touched=r[m2[1]].touched||{};r[m2[1]].touched.ok=true}
  syncDefaults(r);saveRoom(r);
  if(redraw&&(/\.n$|\.gn$/.test(name)||/^ouv\.\d+\.n$/.test(name))){const y=window.scrollY;renderRoom();window.scrollTo(0,y)}else{const inp=$(`[data-num="${name}"]`);if(inp&&document.activeElement!==inp)inp.value=getPath(r,name)}}

function shrink(file,max,q,type='image/jpeg'){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*k),h=Math.round(img.naturalHeight*k),cv=document.createElement('canvas');cv.width=w;cv.height=h;const g=cv.getContext('2d');if(type==='image/jpeg'){g.fillStyle='#fff';g.fillRect(0,0,w,h)}g.drawImage(img,0,0,w,h);URL.revokeObjectURL(url);cv.toBlob(b=>b?res(b):rej(new Error('photo illisible')),type,q)};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('format de photo non pris en charge'))};img.src=url})}
function photoName(v,r,cat,n){return`EMAV_${slug(v.etab)}_${r.astech?slug(r.astech):slug(r.salle||'piece')}_${{ens:'piece',ouv:'ouvrant',vent:'ventilation',des:'desordre'}[cat]}${n}.jpg`}
async function addPhotos(r,cat,files){const v=MEM.visits.find(x=>x.id===r.visitId);let k=0;
  for(const f of files){try{const blob=await shrink(f,1600,0.82);const id=uid();await DB.put('photos',{id,blob,visitId:r.visitId,roomId:r.id,ts:Date.now()});
    const n=(r.photos||[]).filter(p=>p.cat===cat).length+1;r.photos=r.photos||[];r.photos.push({id,cat,cap:n===1?CAPTIONS[cat][0]:'',file:photoName(v,r,cat,n)});k++}catch(e){toast(e.message)}}
  await saveRoom(r,true);if(k)toast(k+' photo'+(k>1?'s':'')+' ajoutée'+(k>1?'s':'')+'.')}
const THUMBS=new Map();
const VIA_GW=false; /* version téléphone : pas de passerelle */
const PHDEF='';
const PHREF=new Map();
const refURL=name=>'api/emav-photo?name='+encodeURIComponent(name);
const GWOK=new Map();
const phKeys=n=>{let x=String(n||'').trim();try{x=decodeURIComponent(x)}catch(e){}x=x.toLowerCase();const base=x.replace(/\.[^.]+$/,''),simple=s=>plain(s).replace(/[^a-z0-9]/g,'');
  const k=[x,'s:'+simple(base)];if(base.includes('_'))k.push('p:'+simple(base.slice(0,base.lastIndexOf('_'))));return k};
const PHDIR={h:null,files:null,idx:null,perm:''};
async function phDirLoad(){if(PHDIR.h||PHDIR.loaded)return;PHDIR.loaded=true;try{const d=await DB.get('photos','__phdir__');if(d&&d.h)PHDIR.h=d.h}catch(e){}}
async function phDirIndex(ask){await phDirLoad();if(PHDIR.idx)return PHDIR.idx;const idx=new Map(),add=(name,get)=>{if(!/\.(jpe?g|png|webp|gif|bmp)$/i.test(name))return;for(const k of phKeys(name))if(!idx.has(k))idx.set(k,get)};
  if(PHDIR.files){for(const f of PHDIR.files)add(f.name,async()=>f)}
  else if(PHDIR.h){let p='prompt';try{p=await PHDIR.h.queryPermission({mode:'read'});if(p!=='granted'&&ask)p=await PHDIR.h.requestPermission({mode:'read'})}catch(e){}PHDIR.perm=p;if(p!=='granted')return null;
    const walk=async(dir,depth)=>{for await(const e of dir.values()){if(e.kind==='file')add(e.name,()=>e.getFile());else if(depth<2)await walk(e,depth+1)}};try{await walk(PHDIR.h,0)}catch(e){return null}}
  else return null;PHDIR.idx=idx;return idx}
async function localPhoto(n,ask){const idx=await phDirIndex(ask);if(!idx)return'';for(const k of phKeys(n)){const g=idx.get(k);if(g){try{const f=await g();return URL.createObjectURL(f)}catch(e){return''}}}return''}
async function localPhotoStatus(refs){await phDirLoad();if(!PHDIR.h&&!PHDIR.files)return'';const idx=await phDirIndex(false);
  if(!idx)return`Dossier choisi sur ce poste${PHDIR.h?' ('+esc(PHDIR.h.name)+')':''} : accès à réautoriser, cliquez sur « Choisir le dossier PHOTO EMAV ».`;
  let n=0;const miss=[];for(const r of refs){if(phKeys(r).some(k=>idx.has(k)))n++;else if(miss.length<5)miss.push(r)}
  const ex=[...new Set([...idx.keys()].filter(k=>!k.includes(':')))].slice(0,5);
  return`Dossier choisi sur ce poste${PHDIR.h?' ('+esc(PHDIR.h.name)+')':''} : <b>${n} photo${n>1?'s':''} sur ${refs.length}</b> trouvée${n>1?'s':''}.`+(n<refs.length?`<br>Exemples attendus : ${miss.map(esc).join(' · ')}<br>Exemples présents : ${ex.map(esc).join(' · ')||'aucun'}`:'')}
async function refOK(n){if(GWOK.has(n))return GWOK.get(n);let ok=false;try{const q=await fetch(refURL(n),{method:'GET',cache:'force-cache'});ok=q.ok}catch(e){}GWOK.set(n,ok);return ok}
async function photoURL(id,ask){if(THUMBS.has(id))return THUMBS.get(id);const p=await DB.get('photos',id);if(!p||!p.blob){const n=PHREF.get(id);if(!n){const u=await netPhotoURL(id);if(u)THUMBS.set(id,u);return u}let u=await localPhoto(n,ask);if(!u&&VIA_GW&&await refOK(n))u=refURL(n);if(u)THUMBS.set(id,u);return u}const u=URL.createObjectURL(p.blob);THUMBS.set(id,u);return u}

function visitAgg(rs){const A={n:rs.length,G:0,Gok:0,Genc:0,Gcas:0,Gobt:0,T:0,f:0,a:0,m:0,En:0,Sn:0,Eok:0,Sok:0,Efn:0,Sfn:0,Eobt:0,Sobt:0,Eenc:0,Senc:0,meca:0,mecaKo:0,blind:0,noGrille:0,cls:{good:0,mid:0,bad:0},constats:{}};
  for(const r of rs){const c=roomCalc(r);A.T+=c.T;A.f+=c.f;A.a+=c.a;A.m+=c.m;A.cls[c.cls]++;A.G+=c.G;A.Gok+=c.Gok;A.Genc+=c.Genc;A.Gcas+=c.Gcas;A.Gobt+=c.Gobt;

  if(r.nat==='Oui'){set('Nombre d\'ouvrants en état',c.f);set('Nombre d\'ouvrants facilement accessibles',c.a);set('Nombre d\'ouvrants facilement manœuvrables',c.m)}

  set('Y a t-il des bouches ou grilles d\'aération - entrée',E.has);if(E.has==='Oui'){set('Nombre de bouches ou grilles d\'entrée d\'air',num(E.n));set('Nombre de bouches ou grilles d\'entrée d\'air fonctionnelles',num(E.ok));setNth('Nombre de bouches ou grilles obturées',0,num(E.obt));setNth('Nombre de bouches ou grilles encrassées',0,num(E.enc))}setNth('Commentaires (facultatif)',0,E.com);
  set('Y a t-il des bouches ou grilles d\'aération - sorties',S.has);if(S.has==='Oui'){set('Nombre de bouches ou grilles de sortie d\'air',num(S.n));set('Nombre de bouches ou grilles de sortie d\'air fonctionnelles',num(S.ok));setNth('Nombre de bouches ou grilles obturées',1,num(S.obt));setNth('Nombre de bouches ou grilles encrassées',1,num(S.enc))}setNth('Commentaires (facultatif)',1,S.com);
  set('Photos des bouches de ventilation',ph('vent').map(p=>'photos/'+p.file).join(';'));
  set('Y a t-il des choses particulières',r.constats.join(';'));set('Y a t-il des choses plus spécifique',[r.comConst,r.meca==='Oui'&&(r.mecaEtat||r.mecaCom)?'Ventilation mécanique : '+[r.mecaEtat,r.mecaCom].filter(Boolean).join(', '):''].filter(Boolean).join(' · '));
  set('Photos des désordres',ph('des').map(p=>'photos/'+p.file).join(';'));set('Prénom Nom',v.evaluateur);set('Fonction',v.fonction);
  /* noms de photo n (ventilation / désordre) */
  for(const[cat,word]of[['ouv','ouvrant'],['vent','ventilation'],['des','désordre']]){const L=H.filter(h=>h.replace(/\s+/g,' ').includes('('+word+')'));ph(cat).slice(0,5).forEach((p,i)=>{if(L[i])row[L[i]]=p.cap})}
  return H.map(h=>row[h]);
}

/* ---- PDF : rendu des pages A4 ---- */
function loadScript(url,test){if(test())return Promise.resolve();return new Promise((res,rej)=>{const s=document.createElement('script');s.src=url;s.onload=()=>test()?res():rej(new Error('bibliothèque indisponible'));s.onerror=()=>{s.remove();rej(new Error('bibliothèque PDF indisponible (connexion internet ?)'))};document.head.appendChild(s)})}
async function pdfLibs(){
  const L=[['html2canvas/1.4.1/html2canvas.min.js',()=>window.html2canvas],['jspdf/2.5.1/jspdf.umd.min.js',()=>window.jspdf]];
  for(const[p,t]of L){if(t())continue;if(!IN_CLAUDE){try{await loadScript('lib/'+p.split('/').pop(),t);continue}catch(e){}}await loadScript('https://cdnjs.cloudflare.com/ajax/libs/'+p,t)}}
async function pagesToPDF(html,band,progress){
  await pdfLibs();const host=document.createElement('div');host.style.cssText='position:fixed;left:-10000px;top:0;width:820px;z-index:-1';
  host.innerHTML=`<style>${PAPER_CSS}</style><div class="pd ${band==='none'?'noband':''}"><div class="pages" style="padding:0;gap:0">${html}</div></div>`;document.body.appendChild(host);
  try{await Promise.all([...host.querySelectorAll('img')].map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r})));
    const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait',compress:true}),pages=[...host.querySelectorAll('.page')];
    for(let i=0;i<pages.length;i++){progress&&progress(`PDF : page ${i+1} / ${pages.length}`);const pg=pages[i],h=Math.max(1123,pg.scrollHeight);
      const cv=await html2canvas(pg,{scale:1.7,backgroundColor:'#ffffff',width:794,height:h,windowWidth:900,logging:false});
      if(i)doc.addPage();const hmm=Math.min(297,h*297/1123);doc.addImage(cv.toDataURL('image/jpeg',0.86),'JPEG',0,0,210,hmm)}
    return doc.output('blob')}finally{host.remove()}}

/* ---- export .zip ---- */
async function buildExport(v,opt,st){
  const rs=roomsOf(v.id).slice().sort((a,b)=>String(a.niveau+a.salle).localeCompare(String(b.niveau+b.salle),'fr',{numeric:true}));
  if(!window.JSZip)throw new Error('module zip indisponible');st('Préparation de l\'export…');
  const z=new JSZip(),base=`EMAV_${slug(v.etab)}_${v.date.replace(/-/g,'')}`,f=z.folder(base);
  const used=new Set();for(const r of rs){const cnt={};for(const p of r.photos||[]){cnt[p.cat]=(cnt[p.cat]||0)+1;let nm=photoName(v,r,p.cat,cnt[p.cat]);while(used.has(nm))nm=nm.replace(/(\d*)\.jpg$/,(m,d)=>(+d||1)+1+'.jpg');used.add(nm);p.file=nm}saveRoom(r)}
  if(opt.photos){const pf=f.folder('photos');let k=0,tot=rs.reduce((a,r)=>a+(r.photos||[]).length,0);
    for(const r of rs)for(const p of r.photos||[]){const d=await DB.get('photos',p.id);if(d&&d.blob)pf.file(p.file,d.blob);else if(p.ref){const u=await photoURL(p.id);if(u){try{const q=await fetch(u);if(q.ok)pf.file(p.file,await q.blob())}catch(e){}}}k++;st(`Photos : ${k} / ${tot}`)}}
  f.file('reponses_forms.csv',toCSV([FORMS_HEADERS.map(h=>h.trim())].concat(rs.map((r,i)=>formsRow(v,r,i+1)))));
  f.file('reponses_completes.csv',toCSV([FULL_COLS.map(c=>c[0])].concat(rs.map(r=>FULL_COLS.map(c=>c[1](v,r))))));
  f.file('visite.json',JSON.stringify({format:'emav-terrain',version:1,exportedAt:new Date().toISOString(),visite:v,pieces:rs,logo:LS.get('emav_logo','')||undefined},null,1));
  if(opt.photos){const src=p=>'photos/'+p.file,cls=opt.band==='none'?' noband':'';
    f.file('Fiches_pieces.html',wrapDoc('Fiches des pièces · '+v.etab,rs.map(r=>roomReport(v,r,src)).join(''),cls));
    f.file('Fiche_etablissement.html',wrapDoc('Fiche établissement · '+v.etab,etabReport(v,rs),cls))}
  if(opt.band==='blue'||opt.band==='none'){const urls={};for(const r of rs)for(const p of r.photos||[])urls[p.id]=await photoURL(p.id);const src=p=>urls[p.id]||'';
    f.file('Fiche_etablissement.pdf',await pagesToPDF(etabReport(v,rs),opt.band,m=>st('Fiche établissement · '+m)));
    if(rs.length)f.file('Fiches_pieces.pdf',await pagesToPDF(rs.map(r=>roomReport(v,r,src)).join(''),opt.band,m=>st('Fiches des pièces · '+m)))}
  f.file('Lisez-moi.txt',`Export EMAV terrain : ${v.etab}, visite du ${frDate(v.date)}\r\n\r\n- reponses_forms.csv : une ligne par pièce, colonnes identiques à l'export Microsoft Forms (feuille FORMSBRUT de la macro EMAV). Ouvrir avec Excel (séparateur point-virgule), copier les lignes.\r\n- reponses_completes.csv : toutes les réponses, y compris les questions ajoutées.\r\n- visite.json : sauvegarde complète, à réimporter dans EMAV terrain sur ordinateur (Accueil > Importer une visite).\r\n${opt.photos?'- photos : photos compressées (1600 px), nommées EMAV_établissement_pièce_catégorie.\r\n- Fiches_pieces.html et Fiche_etablissement.html : fiches en page web (Imprimer > Enregistrer en PDF).\r\n':'- export allégé : sans les photos (la réimport ne contiendra pas les photos).\r\n'}${opt.band&&opt.band!=='html'?'- Fiche_etablissement.pdf et Fiches_pieces.pdf : fiches prêtes à transmettre.\r\n':''}`);
  st('Compression…');const blob=await z.generateAsync({type:'blob',compression:'STORE'},m=>st(`Compression : ${Math.round(m.percent)} %`));
  return{blob,fn:base+(opt.photos?'':'_sans_photos')+'.zip'};
}
async function saveBlob(blob,fn,st){
  if(downloads){try{await downloads.save({filename:fn,data:blob});return true}catch(e){st(e&&e.code==='declined'?'Enregistrement annulé.':'Enregistrement impossible ('+(e&&e.code||'erreur')+').');return false}}
  if(IN_CLAUDE){st('Le téléchargement n\'est pas disponible dans cette vue.');return false}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);return true}
const mo=b=>(b.size/1048576).toFixed(1).replace('.',',')+' Mo';
async function exportZip(v){
  const st=m=>{$('#xst').textContent=m};const band=await askBand(true);if(!band)return;
  const{blob,fn}=await buildExport(v,{photos:true,band},st);

}

async function sendPoste(v){const st=m=>{$('#xst').textContent=m};const band=await askBand(true);if(!band)return;
  const{blob,fn}=await buildExport(v,{photos:true,band},st);st(`Envoi de ${fn} (${mo(blob)}) au poste…`);
  const r=await fetch('depot?name='+encodeURIComponent(fn),{method:'POST',body:blob});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('erreur '+r.status));
  st(`Envoyé au poste : ${j.path||fn}. Sur l'ordinateur, ouvrez EMAV et utilisez « Importer une visite (.zip) » (le fichier est dans le dossier Depots_telephone de QAI_CO2).`);v.exported=Date.now();saveVisit(v)}
async function exportMail(v){
  const st=m=>{$('#xst').textContent=m};
  const what=await askChoice('Envoyer par email','Choisissez le contenu. Les messageries limitent souvent les pièces jointes à 10 à 20 Mo.',
    [{k:'full',t:'Tout',d:'réponses, fiches PDF et photos',pri:true},{k:'light',t:'Léger',d:'fiches PDF et réponses, sans les photos'}]);if(!what)return;
  const band=await askBand(false);if(!band)return;
  const{blob,fn}=await buildExport(v,{photos:what==='full',band},st);
  const to=LS.get('emav_mail',''),subj=`EMAV · ${v.etab} · visite du ${frDate(v.date)}`,rs=roomsOf(v.id),A=visitAgg(rs);
  const body=`Bonjour,\n\nCi-joint l'évaluation des moyens d'aération et de ventilation de ${v.etab} (visite du ${frDate(v.date)}) : ${rs.length} pièce${rs.length>1?'s':''} investiguée${rs.length>1?'s':''}, ${A.T} ouvrant${A.T>1?'s':''} dont ${A.f} fonctionnel${A.f>1?'s':''}.\n\nFichier : ${fn}\n\n${v.evaluateur||''}`;
  const file=new File([blob],fn,{type:'application/zip'});
  if(blob.size>20*1048576)toast(`Fichier de ${mo(blob)} : il risque d'être refusé par la messagerie. Préférez l'envoi léger.`,5000);
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:subj,text:body});st(`Partagé : ${fn} (${mo(blob)}).`);v.exported=Date.now();saveVisit(v);return}}
  catch(e){if(e&&e.name==='AbortError'){st('Envoi annulé.');return}}
  /* sans partage natif : enregistrer le fichier puis ouvrir la messagerie */
  if(!(await saveBlob(blob,fn,st)))return;v.exported=Date.now();saveVisit(v);
  const url=`mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body+'\n\n(Pensez à joindre le fichier '+fn+' enregistré dans vos téléchargements.)')}`;
  st(`${fn} enregistré (${mo(blob)}). Ouverture de la messagerie : joignez le fichier au message.`);
  const w=window.open(url,'_blank');if(!w){const a=document.createElement('a');a.href=url;a.target='_top';document.body.appendChild(a);a.click();a.remove()}
}
